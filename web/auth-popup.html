<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Signing in…</title>
</head>
<body>
<!--
  MSAL popup / silent-iframe redirect target.

  *** WHY THE PREVIOUS (EMPTY) VERSION OF THIS PAGE CAUSED "timed_out" ***
  The earlier version of this file was deliberately empty, based on how
  MSAL.js v2/v3 worked: the opener window polled the popup's URL and
  closed it itself. index.html now loads msal-browser v5.23.0, and MSAL v5
  NO LONGER POLLS THE POPUP. Instead the opener listens on a
  BroadcastChannel and waits for the redirect page to post the auth
  response back. An empty page never posts anything, so after the popup
  bridge timeout MSAL rejects with BrowserAuthError "timed_out"
  (internal reason "redirect_bridge_timeout") — exactly the error shown
  on the Policy & Compliance tab. COOP headers were never the cause;
  BroadcastChannel works regardless of Cross-Origin-Opener-Policy.

  The fix: this page loads MSAL's official redirect bridge and calls
  broadcastResponseToMainFrame(), which reads the auth code from the URL,
  broadcasts it to the main app, and closes the popup (or ends the
  hidden iframe used by acquireTokenSilent). It still contains no app
  logic and never calls handleRedirectPromise(), so the original
  popup_window_error race this page was created to avoid does not return.

  The bridge is self-hosted (msal-redirect-bridge.js, same folder) rather
  than loaded from a CDN, so sign-in has no third-party dependency here.
  Its version must match the msal-browser version imported in index.html.
-->
<p id="msg" style="font-family:system-ui,sans-serif;font-size:14px;color:#555;padding:16px;">Signing you in…</p>
<script src="msal-redirect-bridge.js"></script>
<script>
  window.msalBroadcastResponseToMainFrame().catch(function (err) {
    console.error("MSAL redirect bridge failed:", err);
    document.getElementById("msg").textContent =
      "Sign-in could not be completed. Close this window and try again.";
  });
</script>
</body>
</html>
